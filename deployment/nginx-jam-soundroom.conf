# Parallel jam host — live now; becomes primary after migration (~3–4 days).
# Disable jam.valaki.in vhost once clients and share links use jam.soundroom.in.
#
#   sudo cp deployment/nginx-jam-soundroom.conf /etc/nginx/sites-available/jam.soundroom.in
#   sudo ln -sf /etc/nginx/sites-available/jam.soundroom.in /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d jam.soundroom.in
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name jam.soundroom.in;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/jam.soundroom.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jam.soundroom.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name jam.soundroom.in;
    return 301 https://$host$request_uri;
}

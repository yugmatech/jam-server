# Current primary jam host (backward compatible — keep until clients migrate).
# Same backend as jam.soundroom.in (127.0.0.1:3001).
#
#   sudo cp deployment/nginx-jam.conf /etc/nginx/sites-available/jam.valaki.in
#   sudo ln -sf /etc/nginx/sites-available/jam.valaki.in /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d jam.valaki.in
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name jam.valaki.in;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/jam.valaki.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jam.valaki.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name jam.valaki.in;
    return 301 https://$host$request_uri;
}
